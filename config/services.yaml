parameters:
    app.session_lifetime: 21600
    base_uri_hubspot: 'https://api.hubapi.com'
    hubspot_portal_id: '143807682'
    hubspot_access: '%env(HUBSPOT_ACCESS_TOKEN)%'
    hubspot_order_form_pipeline_label: 'Pipeline sales'
    hubspot_order_form_pipeline_value: 'default'
    hubspot_order_form_stage_label: 'Sending the offer'
    hubspot_order_form_tax_rate_group_ids:
        '5.5': '115152085'
        '20': '115152086'
    hubspot_delivery_order_pipeline: '3942112450'
    hubspot_delivery_order_stage: '5659785460'
    hubspot_delivery_order_excluded_client_ids:
        - '9DACHSER'
        - '9JUNG'
        - '9EDTRANS'
        - '9STEFRESTAURATION'
        - '9LNSTR'
        - '9LISALHUILLIER'
        - '9LOGISTIQUESERV'
        - '9MEDIATOONLIC'
        - '9STEFT'
        - '9STEFTS'
    hubspot_delivery_order_excluded_pieces:
        - 'BL002189'
        - 'FA002494'
        - 'FA000458'
        - 'FA000240'
        - 'FA000567'
        - 'FA000438'
        - 'FA000354'
        - 'FA000568'
        - 'FA001150'
        - 'FA000546'
    hubspot_delivery_order_company_ids:
        'BTBKIKIMANGA': '422607287483'
        'CARREFOURMABONS': '132134684877'
        '9GEEK': '150880569544'
    delivery_order_report_recipient: 'corentin.bury@lnstrade.fr'
    base_uri_sage: '%env(SAGE_BASE_URI)%'
    sage_username: '%env(SAGE_USERNAME)%'
    sage_password: '%env(SAGE_PASSWORD)%'
    sage_api_rate_limit: 55
    sage_api_rate_interval: 60
    mailer_from: 'pro@ultrapop.com'
    erp_order_notification_recipients:
        - 'corentin.bury@lnstrade.fr'
        - 'nikoloz.mamyan@lnstrade.fr'
    order_form_upload_dir: '%kernel.project_dir%/var/uploads/order_forms'
    sample_shipment_pin: '%env(SAMPLE_SHIPMENT_PIN)%'
    sample_shipment_notification_recipient: 'adv@lnstrade.fr'
    # sage_client_id: '%env(default::SAGE_CLIENT_ID)%'
    # sage_client_secret: '%env(default::SAGE_CLIENT_SECRET)%'    

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Mailer\SimpleMailerService:
        arguments:
            $defaultFrom: '%mailer_from%'
            $defaultRecipients: '%erp_order_notification_recipients%'

    App\Service\Monitoring\CronHeartbeatService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Erp\SageApiRateLimiter:
        arguments:
            $maxCalls: '%sage_api_rate_limit%'
            $intervalSeconds: '%sage_api_rate_interval%'

    App\Service\HubSpot\HubspotDeliveryOrderSyncService:
        arguments:
            $excludedClientIds: '%hubspot_delivery_order_excluded_client_ids%'
            $excludedPieces: '%hubspot_delivery_order_excluded_pieces%'
            $companyIdsByClientId: '%hubspot_delivery_order_company_ids%'

    App\EventSubscriber\SessionRenewalSubscriber:
        arguments:
            $sessionLifetime: '%app.session_lifetime%'

    App\Service\SampleShipment\SampleShipmentAccessService:
        arguments:
            $pin: '%sample_shipment_pin%'
            $appSecret: '%kernel.secret%'

    App\Controller\SampleShipmentController:
        arguments:
            $sampleShipmentAuthLimiter: '@limiter.sample_shipment_auth'
